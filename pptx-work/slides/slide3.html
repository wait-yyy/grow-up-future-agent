<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; }
.head { position: absolute; top: 38pt; left: 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.wrap { margin: 0 60pt; }
.kicker { color: #5a6572; font-size: 15pt; margin: 0 0 10pt 0; }
h1 { color: #1a2333; font-size: 36pt; margin: 0; line-height: 1.35; }
h1 span { color: #0e9f7e; }
.cards { margin-top: 30pt; display: flex; gap: 14pt; }
.card { flex: 1; background: #f4f6f8; border-top: 3pt solid #0e9f7e; padding: 16pt 14pt; }
.card p { margin: 0; }
.card .ic { color: #0e9f7e; font-size: 20pt; font-weight: bold; }
.card .ct { color: #1a2333; font-size: 13pt; margin: 6pt 0 0 0; font-weight: bold; }
.card .cd { color: #8a93a0; font-size: 10pt; margin: 4pt 0 0 0; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">02</p></span><span class="title"><p style="margin:0;">定位</p></span></div>
<div class="wrap">
  <p class="kicker">不是更会聊天的 AI</p>
  <h1>是记得你<span>成长轨迹</span>的知音</h1>
  <div class="cards">
    <div class="card"><p class="ic">01</p><p class="ct">记忆可见</p><p class="cd">看得见 AI 记住了什么</p></div>
    <div class="card"><p class="ic">02</p><p class="ct">可校准</p><p class="cd">能编辑、纠正、归档</p></div>
    <div class="card"><p class="ic">03</p><p class="ct">只属于你</p><p class="cd">本地存储，隐私不出端</p></div>
  </div>
</div>
</body>
</html>
