<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.head { margin: 34pt 50pt 0 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.h { margin: 10pt 50pt 0 50pt; }
h1 { color: #1a2333; font-size: 26pt; margin: 0; }
.grid { margin: 24pt 50pt 0 50pt; display: flex; gap: 14pt; }
.col { flex: 1; }
.big { background: #f4f6f8; border-left: 3pt solid #0e9f7e; padding: 18pt 16pt; }
.big p { margin: 0; }
.big .t { color: #1a2333; font-size: 15pt; font-weight: bold; }
.big .d { color: #1a2333; font-size: 11pt; margin-top: 6pt; line-height: 1.6; }
.big .metric { color: #0e9f7e; font-size: 30pt; font-weight: bold; margin-top: 10pt; }
.big .metricl { color: #3a4655; font-size: 10pt; }
.small { background: #f4f6f8; padding: 14pt 16pt; margin-top: 12pt; border-left: 3pt solid #e0552a; }
.small p { margin: 0; }
.small .t { color: #1a2333; font-size: 12pt; font-weight: bold; }
.small .d { color: #3a4655; font-size: 10pt; margin-top: 4pt; line-height: 1.5; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">05</p></span><span class="title"><p style="margin:0;">Demo 亮点</p></span></div>
<div class="h"><h1>两个让评委记住你的瞬间</h1></div>
<div class="grid">
  <div class="col">
    <div class="big">
      <p class="t">成长轨迹页</p>
      <p class="d">把 AI 对你的记忆，具象成一条可回看的成长时间线</p>
      <p class="metric">4</p>
      <p class="metricl">总记忆 · 主题 · 陪伴天数 · 文件夹</p>
    </div>
    <div class="small">
      <p class="t">陪伴人格回复</p>
      <p class="d">不是工具腔，而是「记得你」的知音语气</p>
    </div>
  </div>
  <div class="col">
    <div class="small" style="border-left:3pt solid #0e9f7e;">
      <p class="t">对话 → 自动出记忆卡</p>
      <p class="d">说几句，右侧就长出你的「记忆卡片」</p>
    </div>
    <div class="small" style="border-left:3pt solid #0e9f7e;">
      <p class="t">勾选文件夹 → 生成 Main_link</p>
      <p class="d">几秒整合成上下文，下一轮带着记忆回应</p>
    </div>
    <div class="small" style="border-left:3pt solid #0e9f7e;">
      <p class="t">语音输入</p>
      <p class="d">像和真朋友说话那样开口交流</p>
    </div>
  </div>
</div>
</body>
</html>
