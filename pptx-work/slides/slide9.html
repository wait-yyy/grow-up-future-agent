<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.corner { position: absolute; top: 0; left: 0; width: 120pt; height: 120pt; background: #0e9f7e; clip-path: polygon(0 0, 100% 0, 0 100%); }
.icon { color: #0e9f7e; font-size: 34pt; }
h1 { color: #1a2333; font-size: 34pt; margin: 16pt 0 10pt 0; }
h1 span { color: #0e9f7e; }
.sub { color: #5a6572; font-size: 14pt; margin: 0; line-height: 1.7; }
.btns { margin-top: 24pt; }
.tag { display: inline-block; background: rgba(14,159,126,0.10); color: #0e9f7e; font-size: 12pt; padding: 6pt 18pt; border-left: 3pt solid #0e9f7e; }
</style>
</head>
<body>
<div class="corner"></div>
<div class="icon"><p style="margin:0;">◈</p></div>
<h1>记忆，<span>只属于你</span></h1>
<p class="sub">不是更会聊天的 AI<br>是记得你成长轨迹的知音</p>
<div class="btns"><span class="tag"><p style="margin:0;">Grow Up · 谢谢聆听</p></span></div>
</body>
</html>
