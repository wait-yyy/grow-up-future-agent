<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.head { margin: 34pt 50pt 0 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.h { margin: 10pt 50pt 0 50pt; }
h1 { color: #1a2333; font-size: 26pt; margin: 0; }
.track { margin: 26pt 50pt 0 50pt; display: flex; align-items: flex-start; }
.phase { flex: 1; }
.node { width: 14pt; height: 14pt; border-radius: 50%; background: #0e9f7e; }
.phase.dim .node { background: #e3e7ec; }
.line { height: 2pt; background: #0e9f7e; flex: 1; margin-top: 6pt; }
.line.dim { background: #e3e7ec; }
.phase p { margin: 0; }
.phase .pt { color: #0e9f7e; font-size: 12pt; font-weight: bold; margin-top: 10pt; }
.phase.dim .pt { color: #8a93a0; }
.phase .pn { color: #1a2333; font-size: 14pt; font-weight: bold; margin-top: 4pt; }
.phase.dim .pn { color: #8a93a0; }
.phase .pd { color: #5a6572; font-size: 10pt; margin-top: 6pt; line-height: 1.6; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">08</p></span><span class="title"><p style="margin:0;">路线图</p></span></div>
<div class="h"><h1>从「记得你」到「懂你」</h1></div>
<div class="track">
  <div class="phase">
    <div class="node"></div>
    <p class="pt">现在</p>
    <p class="pn">记忆闭环</p>
    <p class="pd">对话提炼 · 归档<br>Main_link · 成长轨迹</p>
  </div>
  <div class="line"></div>
  <div class="phase">
    <div class="node"></div>
    <p class="pt">近期</p>
    <p class="pn">多模态</p>
    <p class="pd">语音输出 TTS<br>图片记忆</p>
  </div>
  <div class="line"></div>
  <div class="phase">
    <div class="node"></div>
    <p class="pt">中期</p>
    <p class="pn">情绪感知</p>
    <p class="pd">识别情绪 · 主动关怀<br>记忆回看</p>
  </div>
  <div class="line dim"></div>
  <div class="phase dim">
    <div class="node"></div>
    <p class="pt">远期</p>
    <p class="pn">云端同步</p>
    <p class="pd">跨设备记忆<br>端到端加密</p>
  </div>
</div>
</body>
</html>
