<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; }
.wrap { margin: 0 70pt; }
.tag { display: inline-block; background: rgba(14,159,126,0.10); color: #0e9f7e; font-size: 12pt; padding: 4pt 14pt; border-left: 3pt solid #0e9f7e; }
h1 { color: #1a2333; font-size: 46pt; margin: 18pt 0 8pt 0; letter-spacing: 2pt; }
h1 span { color: #0e9f7e; }
.sub { color: #5a6572; font-size: 16pt; margin: 0; }
.line { width: 80pt; height: 3pt; background: #0e9f7e; margin: 22pt 0; }
.foot { color: #8a93a0; font-size: 11pt; margin: 0; letter-spacing: 1pt; }
.corner { position: absolute; top: 0; right: 0; width: 120pt; height: 120pt; background: #0e9f7e; clip-path: polygon(100% 0, 100% 100%, 0 0); }
</style>
</head>
<body>
<div class="corner"></div>
<div class="wrap">
  <div class="tag"><p style="margin:0;">HACKATHON PITCH</p></div>
  <h1>Grow <span>Up</span></h1>
  <p class="sub">记得你成长轨迹的知音</p>
  <div class="line"></div>
  <p class="foot">记忆可见 · 可校准 · 只属于你</p>
</div>
</body>
</html>
