<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.head { margin: 38pt 50pt 0 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.h { margin: 14pt 50pt 0 50pt; }
h1 { color: #1a2333; font-size: 30pt; margin: 0; line-height: 1.3; }
.quote { margin: 26pt 50pt 0 50pt; padding: 22pt 26pt; background: #f4f6f8; border-left: 4pt solid #e0552a; }
.quote p { margin: 0; color: #1a2333; font-size: 18pt; line-height: 1.5; }
.quote span { color: #e0552a; }
.body { margin: 22pt 50pt 0 50pt; }
.body p { color: #5a6572; font-size: 14pt; line-height: 1.7; margin: 0; }
.body b { color: #1a2333; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">01</p></span><span class="title"><p style="margin:0;">痛点</p></span></div>
<div class="h"><h1>AI 陪伴最大的谎言，<br>是它说记得你，其实不记得</h1></div>
<div class="quote">
  <p>"陪伴我三年的 AI，一次更新后<span>把我全忘了</span>，<br>像一个陌生人重新认识我。"</p>
</div>
<div class="body">
  <p>Replika 重置记忆事件，让百万用户意识到：<br><b>情感记忆黑箱</b> · <b>云端不可控</b> · <b>成长不可见</b></p>
</div>
</body>
</html>
