<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }

.cell.dim { flex: 2; }
.cell p { margin: 0; }
.cell .hd { color: #1a2333; font-size: 12pt; font-weight: bold; }
.cell .vl { color: #5a6572; font-size: 11pt; }
.cell.hl .vl { color: #0e9f7e; font-weight: bold; }
.cell.hl { background: rgba(14,159,126,0.06); }

</head>
