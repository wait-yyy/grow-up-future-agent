<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.head { margin: 34pt 50pt 0 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.h { margin: 10pt 50pt 0 50pt; }
h1 { color: #1a2333; font-size: 26pt; margin: 0; }
.flow { margin: 26pt 40pt 0 40pt; display: flex; align-items: center; justify-content: space-between; }
.step { width: 110pt; background: #f4f6f8; border-left: 3pt solid #0e9f7e; padding: 12pt 10pt; }
.step p { margin: 0; }
.step .st { color: #0e9f7e; font-size: 10pt; }
.step .sn { color: #1a2333; font-size: 13pt; font-weight: bold; margin: 4pt 0 0 0; }
.step .sd { color: #8a93a0; font-size: 9pt; margin: 4pt 0 0 0; }
.arrow { color: #0e9f7e; font-size: 18pt; font-weight: bold; }
.loop { margin: 22pt 50pt 0 50pt; padding: 12pt 18pt; background: rgba(14,159,126,0.08); border-left: 3pt solid #0e9f7e; }
.loop p { margin: 0; color: #5a6572; font-size: 12pt; }
.loop b { color: #0e9f7e; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">03</p></span><span class="title"><p style="margin:0;">记忆闭环机制</p></span></div>
<div class="h"><h1>对话即记忆，记忆即成长</h1></div>
<div class="flow">
  <div class="step"><p class="st">STEP 1</p><p class="sn">对话</p><p class="sd">用户与知音交流</p></div>
  <p class="arrow">→</p>
  <div class="step"><p class="st">STEP 2</p><p class="sn">自动提炼</p><p class="sd">拆分主题记忆卡</p></div>
  <p class="arrow">→</p>
  <div class="step"><p class="st">STEP 3</p><p class="sn">归档</p><p class="sd">多文件夹分类</p></div>
  <p class="arrow">→</p>
  <div class="step"><p class="st">STEP 4</p><p class="sn">Main_link</p><p class="sd">整合为上下文</p></div>
  <p class="arrow">↺</p>
</div>
<div class="loop">
  <p><b>闭环回灌：</b>下一轮对话，AI 带着 Main_link 记忆回应 —— 越聊越懂你</p>
</div>
</body>
</html>
