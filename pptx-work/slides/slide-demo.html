<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
.head { margin: 34pt 50pt 0 50pt; display: flex; align-items: center; gap: 12pt; }
.num { color: #0e9f7e; font-size: 13pt; font-weight: bold; border-left: 3pt solid #0e9f7e; padding-left: 10pt; }
.title { color: #5a6572; font-size: 13pt; }
.h { margin: 10pt 50pt 0 50pt; }
h1 { color: #1a2333; font-size: 26pt; margin: 0; }
.boxes { margin: 22pt 50pt 0 50pt; display: flex; gap: 20pt; }
.box { flex: 1; height: 210pt; border: 2pt solid #0e9f7e; background: rgba(14,159,126,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.box p { margin: 0; }
.box .ic { color: #0e9f7e; font-size: 28pt; }
.box .bt { color: #1a2333; font-size: 15pt; font-weight: bold; margin-top: 10pt; }
.box .bd { color: #5a6572; font-size: 11pt; margin-top: 6pt; }
</style>
</head>
<body>
<div class="head"><span class="num"><p style="margin:0;">06</p></span><span class="title"><p style="margin:0;">产品演示</p></span></div>
<div class="h"><h1>产品演示</h1></div>
<div class="boxes">
  <div class="box">
    <p class="ic">▶</p>
    <p class="bt">视频演示界面</p>
    <p class="bd">此处插入演示视频截图</p>
  </div>
  <div class="box">
    <p class="ic">◈</p>
    <p class="bt">介绍界面</p>
    <p class="bd">此处插入产品介绍截图</p>
  </div>
</div>
</body>
</html>
